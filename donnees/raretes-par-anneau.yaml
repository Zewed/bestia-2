# US-0927 : la Rareté d'une Bête sauvage qui apparaît se tire selon l'Anneau de sa Case, en pourcentages
# (valeurs provisoires, à régler en jouant). Une ligne par Anneau, de la Couronne (Anneau 1) au Cœur sauvage
# (Anneau 6, voir ANNEAUX_DU_MONDE dans src/reglages.ts), chacune à 100 en tout.
# Toutes les Raretés de commune à légendaire apparaissent partout, les communes toujours plus de la moitié du
# temps ; chaque Rareté au-dessus devient plus fréquente à mesure qu'on approche du Cœur sauvage.
# Jamais de mythique : elles ne viennent que des Apparitions.

- anneau: 1
  commune: 80
  peu_commune: 15
  rare: 4
  epique: 0.8
  legendaire: 0.2
- anneau: 2
  commune: 76
  peu_commune: 17
  rare: 5.4
  epique: 1.3
  legendaire: 0.3
- anneau: 3
