# Les Couples de départ : le nouveau joueur en choisit un parmi ces Espèces, dans cet ordre.
# style : ce que ce Couple apporte ; phrase : ce que l'écran du choix en dit.

- espece: souris
  style: Se défendre
  phrase: "Petites, nombreuses, et elles mordent."
- espece: poule
  style: Grandir
  phrase: "Elles nourrissent votre Territoire."
- espece: pigeon
  style: Explorer
  phrase: "Ils voient loin, et trouvent avant les autres."
