# US-0924 : des Espèces d'essai, provisoires, pour essayer les Bêtes sauvages avant la liste validée des Espèces.
# Chargées seulement sur le poste local et dans les tests, jamais en ligne (src/donnees/jeux.ts) ; aucun code ne
# nomme l'une d'elles. Le jour où la liste validée arrive, on supprime ce fichier : rien d'autre ne change.
# Mêmes champs que especes.yaml ; mesures réelles approchées, sans illustration. Plus une Espèce est forte (son
# attaque, par le barème), plus elle est rare : de commune à légendaire, jamais mythique.

# Communes : une par Biome qui a des Espèces, en plus des trois de la prairie.

- id: ecureuil
  nom: Écureuil roux
  masse_g: 300
  arme: 0.5
  vitesse: 20
  regime: herbivore
  nourriture_g_par_jour: 50
  biome: foret
  rarete: commune
  source: "Sciurus vulgaris : 250 à 340 g, pointes à 20 km/h, 35 à 80 g de graines par jour."

- id: grenouille
  nom: Grenouille verte
  masse_g: 50
  arme: 0.3
  vitesse: 8
  regime: carnivore
  nourriture_g_par_jour: 5
  biome: eau
  rarete: commune
  source: "Pelophylax kl. esculentus : 20 à 100 g, quelques grammes d'insectes par jour."

- id: gerboise
  nom: Gerboise d'Égypte
