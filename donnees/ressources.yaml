# Les quatre Ressources du Territoire, dans l'ordre où elles s'affichent.
# famille : nourriture (ce que mangent les Bêtes et les Habitants) ou materiaux (ce qui sert à construire).
# au_depart : ce que reçoit un Territoire à sa naissance (chiffre à régler en jouant). Le changer ne
# touche que les Territoires qui naissent ensuite.

- id: viande
  nom: Viande
  famille: nourriture
  au_depart: 100
- id: vegetaux
  nom: Végétaux
  famille: nourriture
  au_depart: 100
- id: bois
  nom: Bois
  famille: materiaux
  au_depart: 100
- id: pierre
  nom: Pierre
  famille: materiaux
  au_depart: 100
