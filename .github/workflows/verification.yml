# À chaque envoi, sur toutes les branches : lint, types, garde-fou des migrations,
# tests et scan de secrets. Le résultat s'affiche à côté du commit sur GitHub.
name: Vérification

on:
  push:

jobs:
  verifier:
    name: Lint, types, migrations, tests et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique, pour le scan de secrets
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run secrets:history
